<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>BARAMEEL RUN — Scan the Checkpoint</title><link rel="stylesheet" href="./styles.css"></head><body><main class="scan-stage fade-in"><img class="base" src="./assets/screen05-bg.png" alt="Scan the checkpoint background" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:1"><a class="scan-close" href="./screen04.html" aria-label="Back">×</a><div class="scan-bolt">ϟ</div><div class="camera-frame"><div class="camera-inner"><video id="cameraVideo" playsinline muted></video><div id="placeholder" class="camera-placeholder">CAMERA READY<br><span>Tap below to activate scanning</span></div><div class="corner c1"></div><div class="corner c2"></div><div class="corner c3"></div><div class="corner c4"></div><div id="scanLine" class="scan-line"></div></div></div><button id="startCam" class="scan-button">OPEN CAMERA</button><div id="status" class="scan-status">Ready to scan…</div><div id="success" class="scan-success"><div class="box"><strong>CHECKPOINT FOUND</strong><div id="decoded">QR code detected.</div><button class="scan-button" style="position:static;margin-top:18px;height:auto;padding:12px" onclick="location.reload()">SCAN AGAIN</button></div></div></main><script src="./app.js"></script><script>
let stream=null,detector=null,scanning=false;
const video=document.getElementById('cameraVideo'),placeholder=document.getElementById('placeholder'),status=document.getElementById('status'),btn=document.getElementById('startCam'),line=document.getElementById('scanLine'),success=document.getElementById('success'),decoded=document.getElementById('decoded');
async function startCamera(){BR.scanSound();if(!navigator.mediaDevices?.getUserMedia){status.textContent='Camera is not supported on this browser.';return}try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}},audio:false});video.srcObject=stream;await video.play();video.style.display='block';placeholder.style.display='none';line.style.display='block';status.textContent='Scanning…';btn.textContent='SCANNING…';scanning=true;if('BarcodeDetector' in window){try{detector=new BarcodeDetector({formats:['qr_code']})}catch(e){detector=new BarcodeDetector()}detectLoop()}else{status.textContent='Camera active — QR auto-detection depends on browser support.'}}catch(e){BR.errorSound();status.textContent='Camera permission was blocked. Allow camera access and try again.';placeholder.innerHTML='CAMERA ACCESS REQUIRED<br><span>Allow camera permission, then try again.</span>'}}
async function detectLoop(){if(!scanning||!detector)return;try{const codes=await detector.detect(video);if(codes.length){decoded.textContent=codes[0].rawValue||'QR code detected.';success.classList.add('show');status.textContent='Checkpoint found';scanning=false;line.style.display='none';BR.confirmSound();stream?.getTracks().forEach(t=>t.stop());return}}catch(e){}requestAnimationFrame(detectLoop)}
btn.onclick=startCamera;window.addEventListener('pagehide',()=>stream?.getTracks().forEach(t=>t.stop()));
</script></body></html>
