<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>BARAMEEL RUN — Scan the QR Checkpoint</title><link rel="stylesheet" href="./styles.css"></head><body><main class="scan-stage fade-in"><img id="scanBg" class="base art-ready" src="./assets/screen05-bg.png" alt="Scan the QR checkpoint background" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:1"><a class="scan-close" href="./screen04.html" aria-label="Back">×</a><div class="scan-bolt">ϟ</div><div class="camera-frame"><div class="camera-inner"><video id="cameraVideo" playsinline muted></video><div id="placeholder" class="camera-placeholder">QR CAMERA READY<br><span>Point the camera at the QR code</span></div><div class="corner c1"></div><div class="corner c2"></div><div class="corner c3"></div><div class="corner c4"></div><div id="scanLine" class="scan-line"></div></div></div><div class="scan-qr-badge">QR CODE ONLY</div><button id="startCam" class="scan-button">OPEN CAMERA &amp; SCAN QR</button><div id="status" class="scan-status">Ready to scan a QR checkpoint…</div><div id="success" class="scan-success"><div class="box"><strong>CHECKPOINT FOUND</strong><div id="decoded">QR code detected.</div><button class="scan-button" style="position:static;margin-top:18px;height:auto;padding:12px" onclick="location.reload()">SCAN AGAIN</button></div></div></main><script src="./app.js"></script><script>
const video=document.getElementById('cameraVideo'),placeholder=document.getElementById('placeholder'),status=document.getElementById('status'),btn=document.getElementById('startCam'),line=document.getElementById('scanLine'),success=document.getElementById('success'),decoded=document.getElementById('decoded');
let stream=null,detector=null,scanning=false;
BR.setArt('scanBg','./assets/screen05-bg.png');
async function getRearCamera(){
  const base={audio:false,video:{width:{ideal:1080},height:{ideal:1080},facingMode:{exact:'environment'}}};
  try{return await navigator.mediaDevices.getUserMedia(base)}catch(e){return await navigator.mediaDevices.getUserMedia({audio:false,video:{width:{ideal:1080},height:{ideal:1080},facingMode:{ideal:'environment'}}})}
}
async function startCamera(){
  BR.scanSound();
  if(!navigator.mediaDevices?.getUserMedia){status.textContent='Camera is not supported on this browser.';return}
  try{
    stream=await getRearCamera();
    video.srcObject=stream;await video.play();video.style.display='block';placeholder.style.display='none';line.style.display='block';status.textContent='Scanning QR code…';btn.textContent='SCANNING QR…';scanning=true;
    if('BarcodeDetector' in window){
      try{
        const supported=await BarcodeDetector.getSupportedFormats();
        if(supported.includes('qr_code')) detector=new BarcodeDetector({formats:['qr_code']});
      }catch(e){detector=null}
    }
    if(detector) detectLoop();
    else status.textContent='QR camera active — automatic QR detection is not supported by this browser.';
  }catch(e){BR.errorSound();status.textContent='Camera permission was blocked. Allow camera access and try again.';placeholder.innerHTML='QR CAMERA ACCESS REQUIRED<br><span>Allow camera permission, then try again.</span>'}
}
async function detectLoop(){
  if(!scanning||!detector)return;
  try{const codes=await detector.detect(video);if(codes.length){
      const raw=codes[0].rawValue||'';
      decoded.textContent='Checkpoint QR detected.';
      status.textContent='CHECKPOINT FOUND!';
      scanning=false;
      line.style.display='none';
      stream?.getTracks().forEach(t=>t.stop());
      BR.rewardSound();
      setTimeout(()=>{ location.href='./screen06.html?qr='+encodeURIComponent(raw); },720);
      return
    }}catch(e){}
  requestAnimationFrame(detectLoop)
}
btn.onclick=startCamera;window.addEventListener('pagehide',()=>stream?.getTracks().forEach(t=>t.stop()));
</script></body></html>
