<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>BARAMEEL RUN — Go to BARAMEEL</title>
<link rel="stylesheet" href="./styles.css">
</head>
<body>
<main class="route-stage fade-in">
  <img id="routeArt" class="route-art" src="./assets/screen07.png" alt="Your points are ready — head to BARAMEEL">

  <!-- The artwork contains empty digital boxes. Each live digit is rendered in its own box. -->
  <div id="walkMinutes" class="route-digits route-minutes" aria-label="walking minutes">
    <span class="digit-box" data-digit="min-0">0</span><span class="digit-box" data-digit="min-1">0</span>
  </div>
  <div id="walkMeters" class="route-digits route-meters" aria-label="walking distance in meters">
    <span class="digit-box" data-digit="m-0">0</span><span class="digit-box" data-digit="m-1">0</span><span class="digit-box" data-digit="m-2">0</span>
  </div>

  <!-- Transparent interaction zones aligned to the printed artwork. -->
  <button class="route-back" aria-label="Back" onclick="goBack()"></button>
  <button class="route-walk" aria-label="Walk there" onclick="walkThere()"></button>
  <button class="route-later" aria-label="Later" onclick="goLater()"></button>
  <button class="route-location-retry" aria-label="Refresh location" onclick="loadRoute()"></button>
</main>
<script src="./app.js"></script>
<script>
const BARAMEEL_LAT=31.190587;
const BARAMEEL_LNG=29.920598;
const WALKING_METERS_PER_MINUTE=75; // ~4.5 km/h, matching the visual game's approximate walk timing.
let lastPosition=null;

function haversineMeters(lat1,lon1,lat2,lon2){
  const R=6371000,rad=Math.PI/180;
  const dLat=(lat2-lat1)*rad,dLon=(lon2-lon1)*rad;
  const a=Math.sin(dLat/2)**2+Math.cos(lat1*rad)*Math.cos(lat2*rad)*Math.sin(dLon/2)**2;
  return 2*R*Math.asin(Math.sqrt(a));
}
function setDigits(groupId, value, width){
  const group=document.getElementById(groupId);
  const chars=String(Math.max(0,Math.round(value))).padStart(width,'0').slice(-width).split('');
  [...group.querySelectorAll('.digit-box')].forEach((el,i)=>el.textContent=chars[i]||'0');
}
function updateRoute(pos){
  lastPosition=pos;
  const m=haversineMeters(pos.coords.latitude,pos.coords.longitude,BARAMEEL_LAT,BARAMEEL_LNG);
  const min=Math.max(1,Math.round(m/WALKING_METERS_PER_MINUTE));
  setDigits('walkMinutes',min,2);
  setDigits('walkMeters',Math.min(999,Math.round(m)),3);
}
function loadRoute(){
  if(!navigator.geolocation){BR.toast('Location is not available on this device.');return}
  BR.toast('GETTING YOUR LOCATION…');
  navigator.geolocation.getCurrentPosition(updateRoute,()=>BR.toast('ALLOW LOCATION TO CALCULATE YOUR WALK.'),{enableHighAccuracy:true,maximumAge:15000,timeout:10000});
}
function walkThere(){
  BR.confirmSound();
  const url='https://www.google.com/maps/dir/?api=1&destination='+BARAMEEL_LAT+','+BARAMEEL_LNG+'&travelmode=walking';
  setTimeout(()=>{location.href=url},90);
}
function goBack(){BR.backSound();setTimeout(()=>location.href='./screen06.html?checkpoint=ego',90)}
function goLater(){BR.backSound();setTimeout(()=>location.href='./screen04.html',90)}
window.addEventListener('pageshow',()=>loadRoute(),{once:true});
</script>
</body>
</html>
