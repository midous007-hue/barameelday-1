<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>BARAMEEL RUN — Checkpoint Found</title>
<link rel="stylesheet" href="./styles.css">
</head>
<body>
<main class="checkpoint-stage fade-in">
  <audio id="rewardAudio" preload="auto" src="./assets/reward-levelup.mp3"></audio>
  <img id="checkpointBg" class="checkpoint-art" src="./assets/screen06-base.png" alt="Checkpoint found — Salon EGO">

  <a class="social-hit social-instagram" href="https://www.instagram.com/explore/search/keyword/?q=Ego%20salon%20Alexandria" target="_blank" rel="noopener" aria-label="Instagram"></a>
  <a class="social-hit social-facebook" href="https://www.facebook.com/115007088228497/" target="_blank" rel="noopener" aria-label="Facebook"></a>
  <a class="social-hit social-tiktok" href="https://www.tiktok.com/search?q=Ego%20salon%20Alexandria" target="_blank" rel="noopener" aria-label="TikTok"></a>
  <a class="social-hit social-website" href="https://www.google.com/maps/search/?api=1&query=Ego+salon+Alexandria+Moharam+Bey+Rassafa" target="_blank" rel="noopener" aria-label="EGO Salon location"></a>

  <button class="checkpoint-back" aria-label="Back" onclick="goBack()"></button>
  <button class="checkpoint-continue" aria-label="Continue" onclick="continueAfterReward()"></button>
</main>
<script src="./app.js"></script>
<script>
const rewardAudio=document.getElementById('rewardAudio');
function playRewardAudio(){
  rewardAudio.currentTime=0;
  rewardAudio.volume=1;
  rewardAudio.play().catch(()=>{});
}
window.addEventListener('pageshow',()=>{setTimeout(playRewardAudio,120)},{once:true});
document.addEventListener('pointerdown',()=>{ if(rewardAudio.paused) playRewardAudio(); },{once:true,passive:true});
function goBack(){BR.backSound();setTimeout(()=>location.href='./screen04.html',90)}
function continueAfterReward(){BR.confirmSound();BR.flash();setTimeout(()=>location.href='./screen07.html',120)}
</script>
</body>
</html>
