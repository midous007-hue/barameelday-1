<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>BARAMEEL RUN — Checkpoint Found</title>
<link rel="stylesheet" href="./styles.css">
</head>
<body>
<main class="checkpoint-stage fade-in">
  <img id="checkpointBg" class="checkpoint-art" src="./assets/screen06-base.png" alt="Checkpoint found">

  <!-- Dynamic partner content. This is intentionally one reusable screen for every checkpoint. -->
  <div class="checkpoint-photo-slot">
    <img id="partnerPhoto" class="checkpoint-photo" alt="Checkpoint partner">
    <div id="partnerPhotoFallback" class="partner-photo-fallback">CHECKPOINT</div>
  </div>

  <div class="checkpoint-name-slot">
    <div id="partnerName" class="partner-name">CHECKPOINT</div>
    <div id="partnerTagline" class="partner-tagline">DISCOVER • EXPLORE • ENJOY</div>
  </div>

  <div class="checkpoint-social-slot" aria-label="Partner social links">
    <a id="socialInstagram" class="social-hit social-instagram" href="#" target="_blank" rel="noopener" aria-label="Instagram"></a>
    <a id="socialFacebook" class="social-hit social-facebook" href="#" target="_blank" rel="noopener" aria-label="Facebook"></a>
    <a id="socialTiktok" class="social-hit social-tiktok" href="#" target="_blank" rel="noopener" aria-label="TikTok"></a>
    <a id="socialWebsite" class="social-hit social-website" href="#" target="_blank" rel="noopener" aria-label="Website"></a>
  </div>

  <button class="checkpoint-back back-hotspot" aria-label="Back" onclick="goBack()"></button>
  <button class="checkpoint-continue" aria-label="Continue" onclick="continueAfterReward()"></button>
</main>

<script src="./checkpoints.js"></script>
<script src="./app.js"></script>
<script>
const photo=document.getElementById('partnerPhoto');
const photoFallback=document.getElementById('partnerPhotoFallback');
const nameEl=document.getElementById('partnerName');
const taglineEl=document.getElementById('partnerTagline');

function checkpointFromQuery(){
  const params=new URLSearchParams(location.search);
  const direct=(params.get('checkpoint')||'').trim().toLowerCase();
  if(direct)return direct;
  const raw=(params.get('qr')||'').trim();
  if(!raw)return 'ego';
  try{
    const u=new URL(raw,location.href);
    const q=(u.searchParams.get('checkpoint')||'').trim().toLowerCase();
    if(q)return q;
    const parts=u.pathname.split('/').filter(Boolean);
    const i=parts.indexOf('checkpoint');
    if(i>=0&&parts[i+1])return parts[i+1].toLowerCase();
  }catch(e){}
  return raw.replace(/[^a-z0-9_-]/gi,'').toLowerCase() || 'ego';
}

const id=checkpointFromQuery();
const data=(window.BARAMEEL_CHECKPOINTS||{})[id] || (window.BARAMEEL_CHECKPOINTS||{}).ego;

nameEl.textContent=data.name||'CHECKPOINT';
taglineEl.textContent=data.tagline||'DISCOVER • EXPLORE • ENJOY';

if(data.image){
  photo.src=data.image;
  photo.onload=()=>{photo.classList.add('loaded');photoFallback.style.display='none'};
  photo.onerror=()=>{photo.style.display='none';photoFallback.style.display='flex'};
}else{
  photo.style.display='none';
  photoFallback.style.display='flex';
}

const socials={
  instagram:document.getElementById('socialInstagram'),
  facebook:document.getElementById('socialFacebook'),
  tiktok:document.getElementById('socialTiktok'),
  website:document.getElementById('socialWebsite')
};
Object.entries(socials).forEach(([key,el])=>{
  const url=data.socials?.[key]||'';
  if(url){el.href=url;el.classList.add('active')}
  else{el.removeAttribute('href');el.classList.remove('active');el.setAttribute('aria-disabled','true')}
});

function goBack(){BR.backSound();setTimeout(()=>location.href='./screen04.html',90)}
function continueAfterReward(){BR.confirmSound();BR.flash();setTimeout(()=>location.href='./screen04.html',120)}
</script>
</body>
</html>
