<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>BARAMEEL RUN — Runner Traits</title><link rel="stylesheet" href="./styles.css"></head><body><main class="stage fade-in"><img id="art" class="base" alt="Runner traits"><div class="traits-overlay" aria-label="Runner traits"><div class="trait-row"><div class="trait-label"><i class="trait-dot">⚡</i>SPEED</div><div class="trait-bar"><div id="speed" class="trait-fill"></div></div><b id="speedN" class="trait-value"></b></div><div class="trait-row"><div class="trait-label"><i class="trait-dot">↟</i>JUMP</div><div class="trait-bar"><div id="jump" class="trait-fill"></div></div><b id="jumpN" class="trait-value"></b></div><div class="trait-row"><div class="trait-label"><i class="trait-dot">●</i>COIN</div><div class="trait-bar"><div id="coin" class="trait-fill"></div></div><b id="coinN" class="trait-value"></b></div><div class="trait-row"><div class="trait-label"><i class="trait-dot">★</i>SPECIAL</div><div class="trait-bar"><div id="special" class="trait-fill"></div></div><b id="specialN" class="trait-value"></b></div></div><button class="hotspot" aria-label="Back" style="left:2%;top:2%;width:19%;height:8%" onclick="BR.go('screen02.html')"></button><button id="run" class="hotspot" aria-label="Let's run" style="left:51%;bottom:13%;width:46%;height:14%"></button></main><script src="./app.js"></script><script>const key=BR.selected(),r=BR.RUNNERS[key];BR.setArt('art','./assets/screen03-'+key+'.png',['./assets/screen04-'+key+'.png']);function setTrait(id,value){const fill=document.getElementById(id),n=document.getElementById(id+'N');fill.classList.remove('pulse');void fill.offsetWidth;fill.style.width=(value*20)+'%';fill.classList.add('pulse');n.textContent=value+'/5'}requestAnimationFrame(()=>{setTrait('speed',r.speed);setTrait('jump',r.jump);setTrait('coin',r.coin);setTrait('special',r.energy)});document.getElementById('run').onclick=()=>{BR.confirmSound();BR.go('screen04.html')};</script></body></html>
