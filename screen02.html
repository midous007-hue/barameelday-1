<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>Choose Your Runner</title><link rel="stylesheet" href="./styles.css"></head><body><div id="app"><div class="screen active"><img id="runnerArt" class="art" alt="Choose your runner"><div id="cards"></div><button class="hotspot" aria-label="Back" style="left:2%;top:2%;width:18%;height:8%" onclick="BR.go('index.html')"></button><button id="confirmHotspot" class="hotspot" aria-label="Choose runner" style="right:4%;bottom:7%;width:46%;height:13%"></button></div></div><div id="flash"></div><script src="./app.js"></script><script>
const names={rookie:"THE ROOKIE",skater:"THE SKATER",brona:"BRONA",racer:"THE RACER",chiller:"THE CHILLER",dreamer:"THE DREAMER"};
const art=document.getElementById('runnerArt');
function render(){
  const c=BR.selected(); art.src=BR.A+'screen02-'+c+'.png';
}
function select(c){BR.setSelected(c);render();BR.toast(names[c]+' SELECTED')}
const cards=document.getElementById('cards');
BR.CHARACTERS.forEach((c,i)=>{
  const b=document.createElement('button');b.className='hotspot';b.setAttribute('aria-label',names[c]);
  b.style.left=(1+i*16.35)+'%';b.style.width='15.8%';b.style.top='24%';b.style.height='20%';
  b.onclick=()=>select(c);cards.appendChild(b);
});
document.getElementById('confirmHotspot').onclick=()=>{BR.confirmSound();BR.go('screen03.html',false)};
render();
</script></body></html>
